name: chatbot_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/nexus_start.jpeg
    - assets/images/profile/profile1.jpg
    - assets/images/profile/profile2.jpg
    - assets/images/profile/profile3.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/nexus_logo.png"
  min_sdk_android: 21