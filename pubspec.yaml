name: chatbot_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8
